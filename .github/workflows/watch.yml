name: eBay watcher

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may run it a bit later when busy)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write            # needed to save seen.json back to the repo

concurrency:
  group: ebay-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check eBay
        run: python3 ebay_image_watch.py
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Remember seen listings
        run: |
          git config user.name "ebay-watcher-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          if ! git diff --cached --quiet; then
            git commit -m "Update seen listings"
            git pull --rebase
            git push
          fi
